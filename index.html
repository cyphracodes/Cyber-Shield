<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER SHIELD — PAUSE • CHECK • PROTECT</title>
    <style>
        /* ============ DESIGN SYSTEM & VARIABLES ============ */
        :root {
            --primary: #00d4ff;
            --primary-dark: #0088cc;
            --secondary: #7c3aed;
            --accent: #00ff88;
            --danger: #ef4444;
            --danger-bg: #450a0a;
            --warning: #f59e0b;
            --warning-bg: #451a03;
            --success: #10b981;
            --success-bg: #064e3b;
            --bg-dark: #0b0f19;
            --bg-card: #151d30;
            --bg-input: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --radius: 12px;
            --radius-sm: 8px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.light-theme {
            --bg-dark: #f1f5f9;
            --bg-card: #ffffff;
            --bg-input: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --danger-bg: #fee2e2;
            --warning-bg: #fef3c7;
            --success-bg: #dcfce7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.5;
            min-height: 100vh;
        }

        /* ============ TOP DISCLAIMER BANNER ============ */
        .disclaimer-banner {
            background: linear-gradient(90deg, #1e1b4b, #311042);
            color: #e0e7ff;
            padding: 8px 16px;
            font-size: 0.82rem;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        /* ============ NAVIGATION BAR ============ */
        .navbar {
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
        }

        .shield-badge {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.4);
        }

        .nav-title {
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 1px;
            color: var(--primary);
        }

        .nav-menu {
            display: flex;
            gap: 6px;
        }

        .nav-btn {
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .nav-btn:hover, .nav-btn.active {
            color: var(--primary);
            background: rgba(0, 212, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.3);
        }

        .theme-toggle {
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-main);
            cursor: pointer;
            font-size: 0.8rem;
        }

        /* ============ PAGE SECTIONS ============ */
        .page-section {
            display: none;
        }

        .page-section.active {
            display: block;
        }

        /* ============ HERO HOMEPAGE ============ */
        .hero-viewport {
            position: relative;
            padding: 60px 20px 40px;
            text-align: center;
            overflow: hidden;
            background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #0b0f19 70%);
            min-height: calc(100vh - 120px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #matrixCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.15;
            pointer-events: none;
        }

        .hero-icon {
            font-size: 4rem;
            margin-bottom: 16px;
            display: inline-block;
            animation: floatIcon 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px var(--primary));
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .hero-heading {
            font-size: clamp(2rem, 5vw, 3.8rem);
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #00d4ff, #a855f7, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
        }

        /* PAUSE CHECK PROTECT TAGLINE */
        .tagline-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 10px 0 24px;
            flex-wrap: wrap;
        }

        .tag-pill {
            padding: 6px 18px;
            border-radius: 20px;
            font-weight: 800;
            font-size: clamp(0.9rem, 2.5vw, 1.3rem);
            letter-spacing: 2px;
        }

        .tag-pause { color: #00d4ff; background: rgba(0, 212, 255, 0.12); border: 1px solid rgba(0, 212, 255, 0.3); }
        .tag-check { color: #a855f7; background: rgba(168, 85, 247, 0.12); border: 1px solid rgba(168, 85, 247, 0.3); }
        .tag-protect { color: #00ff88; background: rgba(0, 255, 136, 0.12); border: 1px solid rgba(0, 255, 136, 0.3); }

        .tag-dot { color: var(--text-muted); opacity: 0.5; }

        .hero-subtext {
            max-width: 650px;
            color: var(--text-muted);
            font-size: 1.05rem;
            margin: 0 auto 32px;
        }

        .hero-actions {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-main {
            padding: 14px 28px;
            border-radius: var(--radius-sm);
            border: none;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #ffffff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-main);
            border: 2px solid var(--primary);
        }

        .btn-outline:hover {
            background: rgba(0, 212, 255, 0.1);
        }

        .feature-cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            max-width: 900px;
            width: 100%;
            margin-top: 48px;
        }

        .f-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: var(--radius);
            text-align: center;
        }

        .f-card-icon { font-size: 1.8rem; margin-bottom: 8px; }
        .f-card-title { font-size: 0.9rem; font-weight: 700; margin-bottom: 4px; color: var(--primary); }
        .f-card-desc { font-size: 0.8rem; color: var(--text-muted); }

        /* ============ APP LAYOUT CONTAINER ============ */
        .container {
            max-width: 1000px;
            margin: 24px auto;
            padding: 0 16px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 20px;
            position: relative;
        }

        .section-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .section-header h2 { font-size: 1.6rem; font-weight: 800; }
        .section-header p { color: var(--text-muted); font-size: 0.9rem; }

        /* CATEGORY GRID */
        .cat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 14px;
        }

        .cat-btn {
            background: var(--bg-input);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px 10px;
            text-align: center;
            cursor: pointer;
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .cat-btn:hover, .cat-btn.selected {
            border-color: var(--primary);
            background: rgba(0, 212, 255, 0.1);
            color: var(--primary);
        }

        .cat-btn-icon { font-size: 1.4rem; display: block; margin-bottom: 6px; }

        /* INPUT TABS */
        .tab-bar {
            display: flex;
            gap: 6px;
            background: var(--bg-input);
            padding: 4px;
            border-radius: var(--radius-sm);
            margin-bottom: 14px;
        }

        .tab-item {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .tab-item.active {
            background: var(--bg-card);
            color: var(--primary);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        textarea, input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-input);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.95rem;
        }

        textarea:focus, input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
        }

        .upload-dropzone {
            border: 2px dashed var(--border);
            border-radius: var(--radius-sm);
            padding: 24px;
            text-align: center;
            cursor: pointer;
            color: var(--text-muted);
            background: var(--bg-input);
        }

        .upload-dropzone:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .image-preview-box img {
            max-width: 100%;
            max-height: 220px;
            border-radius: var(--radius-sm);
            margin-top: 10px;
            border: 1px solid var(--border);
        }

        /* SAMPLE BUTTONS */
        .sample-bar {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }

        .sample-btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .btn-sm-sample {
            padding: 5px 12px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: var(--bg-input);
            color: var(--text-main);
            font-size: 0.78rem;
            cursor: pointer;
        }

        .btn-sm-sample:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* RISK RESULT BOXES */
        .result-banner {
            padding: 24px;
            border-radius: var(--radius);
            text-align: center;
            margin-bottom: 16px;
            color: #ffffff;
        }

        .result-banner.high { background: linear-gradient(135deg, #b91c1c, #7f1d1d); }
        .result-banner.medium { background: linear-gradient(135deg, #d97706, #78350f); }
        .result-banner.low { background: linear-gradient(135deg, #047857, #064e3b); }

        .score-badge {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: 3px solid rgba(255,255,255,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
            font-size: 1.8rem;
            font-weight: 900;
        }

        .red-flag-card {
            display: flex;
            gap: 12px;
            padding: 12px;
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            background: var(--bg-input);
            border-left: 4px solid var(--primary);
        }

        .red-flag-card.high { border-color: var(--danger); background: var(--danger-bg); }
        .red-flag-card.medium { border-color: var(--warning); background: var(--warning-bg); }
        .red-flag-card.low { border-color: var(--success); background: var(--success-bg); }

        /* DASHBOARD GRID */
        .dash-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
        }

        .dash-box {
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: var(--radius-sm);
            text-align: center;
        }

        .dash-num {
            font-size: 1.8rem;
            font-weight: 900;
